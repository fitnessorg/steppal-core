services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: steppal
      POSTGRES_PASSWORD: steppal
      POSTGRES_DB: steppal
    ports:
      - "5432:5432"
    volumes:
      - steppal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steppal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  steppal_postgres_data:
